<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vision Quest Brewery Menu</title>
  <style>
    :root {
      --bg: #151c16;
      --panel-bg: #211d18;
      --border-main: #6c7a64;
      --terracotta: #de6e4b;
      --ochre: #eab454;
      --sage: #a7c4a0;
      --bone: #f4ece1;
      --muted: #b8b0a2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      text-shadow: none !important;
      box-shadow: none !important;
    }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%), 
        linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%), 
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
      background-size: 8px 8px;
      color: var(--bone);
      font-family: "Courier New", Courier, "Lucida Console", Monaco, monospace;
      padding: 20px 28px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      image-rendering: pixelated;
    }

    #mountainBg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 38vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    header, .grid {
      position: relative;
      z-index: 2;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      border: 4px solid var(--border-main);
      background: var(--panel-bg);
      padding: 10px 18px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 2.7rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ochre);
    }

    .mountain-glyphs {
      font-size: 1.8rem;
      color: var(--terracotta);
      letter-spacing: 6px;
      user-select: none;
    }

    .brand-subtitle {
      font-size: 1.05rem;
      color: var(--sage);
      letter-spacing: 1px;
      font-weight: 700;
      border-top: 2px dashed var(--border-main);
      padding-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      flex-grow: 1;
    }

    .category-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: space-between;
      height: 100%;
    }

    .card {
      background: var(--panel-bg);
      border: 3px solid var(--border-main);
      padding: 8px 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
      gap: 8px;
    }

    .item-name {
      font-size: 1.48rem;
      font-weight: 900;
      color: var(--bone);
      letter-spacing: -0.5px;
      line-height: 1.05;
    }

    .item-name::before {
      content: "▲ ";
      color: var(--terracotta);
      font-size: 1.1rem;
    }

    .item-abv {
      font-size: 1.08rem;
      font-weight: 900;
      color: var(--bg);
      background: var(--ochre);
      padding: 2px 7px;
      white-space: nowrap;
    }

    .item-desc {
      font-size: 1.02rem;
      color: var(--muted);
      line-height: 1.15;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .item-pricing {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--sage);
      border-top: 2px dotted rgba(167, 196, 160, 0.35);
      padding-top: 3px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <svg id="mountainBg" viewBox="0 0 320 100" preserveAspectRatio="none" shape-rendering="crispEdges">
    <polygon fill="#2b3a2c" points="0,100 0,65 25,65 25,50 45,50 45,35 65,35 65,20 85,20 85,35 105,35 105,55 130,55 130,40 155,40 155,25 175,25 175,15 195,15 195,30 220,30 220,45 250,45 250,30 275,30 275,45 300,45 300,60 320,60 320,100" />
    <polygon fill="#3a2920" points="0,100 0,80 35,80 35,65 60,65 60,50 90,50 90,65 115,65 115,75 145,75 145,55 180,55 180,45 205,45 205,60 235,60 235,70 265,70 265,55 290,55 290,70 320,70 320,100" />
    <rect fill="#eab454" x="65" y="20" width="20" height="5" />
    <rect fill="#eab454" x="175" y="15" width="20" height="5" />
    <rect fill="#de6e4b" x="180" y="45" width="25" height="5" />
  </svg>

  <header>
    <div class="header-top">
      <div class="brand-title">Vision Quest Brewery</div>
      <div class="mountain-glyphs">▲▲▲</div>
    </div>
    <div class="brand-subtitle" id="subtitle">Loading menu...</div>
  </header>

  <div class="grid">
    <div class="category-column" id="left-col"></div>
    <div class="category-column" id="right-col"></div>
  </div>

  <script>
    let lastJson = "";

    function renderColumn(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <div class="card">
          <div class="item-header">
            <span class="item-name">${item.name}</span>
            ${item.abv ? `<span class="item-abv">${item.abv}</span>` : ''}
          </div>
          ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
          ${item.prices && item.prices.length ? `
            <div class="item-pricing">
              ${item.prices.map((p, idx) => `<span>${p}${idx < item.prices.length - 1 ? ' |' : ''}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function loadMenu() {
      try {
        const res = await fetch('menu.json?t=' + Date.now(), { cache: 'no-store' });
        const raw = await res.text();
        if (raw === lastJson) return;
        lastJson = raw;

        const data = JSON.parse(raw);
        document.getElementById('subtitle').textContent = data.subtitle || '';
        renderColumn('left-col', data.left || []);
        renderColumn('right-col', data.right || []);
      } catch (e) {
        // Keep current screen on network blip
      }
    }

    loadMenu();
    setInterval(loadMenu, 60000);
  </script>
</body>
</html>
